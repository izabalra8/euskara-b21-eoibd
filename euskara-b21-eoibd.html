/* ── QUIZ ── */
function startQuiz(scope){quizInit(scope,false);}
function startQuizRev(scope){quizInit(scope,true);}
function quizInit(scope,rev){
  const ws=pickWords(scope);
  if(ws.length<4){openModal('Galdetegia',`<div class="empty"><div class="empty-i">📕</div><p>Hitz gutxiegi.</p></div>`);return;}
  S.ex={mode:'quiz',ws,i:0,score:0,rev,scope};newSession();drawQuiz();
}
function drawQuiz(){
  const e=S.ex,w=e.ws[e.i];
  const eu2es=!e.rev;
  const question=eu2es?w.eu:w.es,correct=eu2es?w.es:w.eu;
  const pool=e.ws.filter((_,i)=>i!==e.i);
  const wrong=[];
  for(const x of [...pool].sort(()=>Math.random()-.5)){const v=eu2es?x.es:x.eu;if(!wrong.includes(v)&&v!==correct)wrong.push(v);if(wrong.length>=3)break;}
  const opts=[correct,...wrong].sort(()=>Math.random()-.5);
  const esc=s=>s.replace(/'/g,"\\'");
  openModal(eu2es?'🎯 Galdetegia':'🔄 Alderantziz',`
    <div class="mprog"><div class="mprog-f" style="width:${e.i/e.ws.length*100}%"></div></div>
    <div class="mmeta">${e.i+1} / ${e.ws.length} ${markHTML(wp(w.eu),'dots')}</div>
    <div class="qq"><div class="q-lbl">${eu2es?'Euskaraz':'Gaztelaniaz'}</div><div class="q-w ${question.length>22?'fc-md':''}">${question}</div></div>
    <div class="opts">${opts.map(o=>`<button class="opt" onclick="quizPick(this,'${esc(o)}','${esc(correct)}','${esc(w.eu)}')">${o}</button>`).join('')}</div>
    <div class="fb" id="qfb"></div>`);
}
function quizPick(btn,chosen,correct,eu){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ok=chosen===correct;btn.classList.add(ok?'ok':'no');
  if(!ok)document.querySelectorAll('.opt').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('ok');});
  const fb=document.getElementById('qfb');
  fb.innerHTML=ok?'✓ Ondo!':'✗ Zuzena: '+correct+'<br><button class="btn-continue" onclick="quizNext()">Segi →</button>';
  fb.className='fb '+(ok?'ok':'no');
  rec(eu,ok,false);
  if(ok){S.ex.score++;setTimeout(quizNext,800);}
}
function quizNext(){S.ex.i++;if(S.ex.i>=S.ex.ws.length)showRes(()=>quizInit(S.ex.scope,S.ex.rev));else drawQuiz();}

/* ── MATCH ── */
function startMatch(scope){
  const ws=pickWords(scope);
  if(ws.length<3){openModal('Lotu',`<div class="empty"><p>Hitz gutxiegi.</p></div>`);return;}
  const batch=[...ws].slice(0,8);
  batch.forEach(w=>delete w._matched);
  const left=[...batch].sort(()=>Math.random()-.5).map(w=>w.eu);
  const right=[...batch].sort(()=>Math.random()-.5).map(w=>w.es);
  S.ex={mode:'match',batch,left,right,sel:null,done:0,score:0,scope};newSession();drawMatch();
}
function drawMatch(){
  const e=S.ex;
  const isDone=v=>e.batch.some(w=>w._matched&&(w.eu===v||w.es===v));
  openModal('🔗 Lotu',`
    <div class="mmeta">${e.done}/${e.batch.length} bikote lotuta</div>
    <div class="mg">
      <div class="mcol"><div class="mcl">Euskaraz</div>${e.left.map((w,i)=>{const cls=isDone(w)?'md':e.sel?.side==='eu'&&e.sel.val===w?'ms':'';return`<button class="mi ${cls}" id="ml-${i}" onclick="matchClick('eu','${w.replace(/'/g,"\\'")}',${i})">${w}</button>`;}).join('')}</div>
      <div class="mcol"><div class="mcl">Gaztelaniaz</div>${e.right.map((w,i)=>{const cls=isDone(w)?'md':e.sel?.side==='es'&&e.sel.val===w?'ms':'';return`<button class="mi ${cls}" id="mr-${i}" onclick="matchClick('es','${w.replace(/'/g,"\\'")}',${i})">${w}</button>`;}).join('')}</div>
    </div>`);
}
function matchClick(side,val,idx){
  const e=S.ex;
  if(!e.sel){e.sel={side,val,idx};drawMatch();return;}
  if(e.sel.side===side){e.sel={side,val,idx};drawMatch();return;}
  const eu=side==='eu'?val:e.sel.val,es=side==='es'?val:e.sel.val;
  const word=e.batch.find(w=>w.eu===eu);
  const ok=word&&word.es===es;
  if(ok){word._matched=true;e.done++;e.score++;rec(eu,true,false);e.sel=null;if(e.done>=e.batch.length){showRes(()=>startMatch(e.scope||'all'));return;}drawMatch();}
  else{
    const id1=e.sel.side==='eu'?`ml-${e.sel.idx}`:`mr-${e.sel.idx}`;
    const id2=side==='eu'?`ml-${idx}`:`mr-${idx}`;
    document.getElementById(id1)?.classList.add('mw');document.getElementById(id2)?.classList.add('mw');
    rec(eu,false,false);setTimeout(()=>{e.sel=null;drawMatch();},500);
  }
}

/* ── EXERCISES (grammar) ── */
let _retryFn=null;
function showRes(retryFn){
  _retryFn=retryFn;const e=S.ex;
  let total=e.ws?.length||e.batch?.length||e.ex?.items?.length||e.ex?.q?.length||1;
  let score=e.score;
  const pct=Math.round(score/total*100);
  const emoji=pct>=80?'🎉':pct>=50?'😊':'💪';
  const msg=pct>=80?'Ondo egin duzu!':pct>=50?'Gaizki ez!':'Gehiago praktikatu!';
  setBody(`<div class="res"><div class="res-e">${emoji}</div><div class="res-t">${msg}</div><div class="res-s">${score}/${total}</div><div class="res-l">${pct}% zuzena</div><div class="res-b"><button class="rb rb-p" id="rb-retry">🔄 Berriz saiatu</button><button class="rb rb-s" onclick="closeModal()">✕ Itxi</button></div></div>`);
  document.getElementById('rb-retry')?.addEventListener('click',()=>{if(_retryFn)_retryFn();});
}

function startEx(id){
  const src=UNIT.exercises.find(e=>e.id===id);if(!src)return;
  const ex={...src};
  if(ex.items)ex.items=[...ex.items].sort(()=>Math.random()-.5);
  if(ex.q)ex.q=[...ex.q].sort(()=>Math.random()-.5);
  S.ex={mode:'ex',ex,i:0,score:0,flip:false};newSession();drawEx();
}
function drawEx(){
  const{ex,i}=S.ex;
  if(ex.type==='gap-mc')drawGapMc(ex,i);
  else if(ex.type==='mc')drawMcEx(ex,i);
  else if(ex.type==='truefalse')drawTf(ex,i);
  else if(ex.type==='flip')drawFlipEx(ex,i);
}
function drawFlipEx(ex,i){
  const item=ex.items[i],total=ex.items.length;
  const fit=t=>t.length>34?'fc-sm':t.length>22?'fc-md':'';
  openModal(ex.title,`
    <div class="mprog"><div class="mprog-f" style="width:${i/total*100}%"></div></div>
    <div class="mmeta">${i+1} / ${total}</div>
    <div class="fcw" onclick="${S.ex.flip?'':'tfFlip()'}" style="cursor:${S.ex.flip?'default':'pointer'}"><div class="fc ${S.ex.flip?'flip':''}" id="tffc">
      <div class="fcf fc-a">
        <div class="fc-lb">${ex.prompt||'Itzuli euskarara'}</div>
        <div class="fc-w ${fit(item.front)}">${item.front}</div>
        <div class="fc-h">👆 Sakatu erantzuna ikusteko</div>
      </div>
      <div class="fcf fc-b">
        <div class="fc-lb">Erantzuna</div>
        <div class="fc-tr ${fit(item.back)}">${item.back}</div>
      </div>
    </div></div>
    <div class="hint">Itzuli buruz · sakatu txartela · gero: 😕 Berriz / 👍 Ongi</div>
    <div class="fcc" id="tffcc" style="display:${S.ex.flip?'flex':'none'}">
      <button class="fcb fcb-a" onclick="tfAns(false)">😕 Berriz</button>
      <button class="fcb fcb-g" onclick="tfAns(true)">👍 Ongi</button>
    </div>`);
}
function exNext(){
  S.ex.i++;
  const total=S.ex.ex.items?.length||S.ex.ex.q?.length||0;
  if(S.ex.i>=total){showRes(()=>startEx(S.ex.ex.id));return;}drawEx();
}

function drawGapMc(ex,i){
  const item=ex.items[i],total=ex.items.length;
  let gapN=0;
  const sent=item.sent.replace(/_____/g,()=>{gapN++;const multi=(item.sent.match(/_____/g)||[]).length>1;return`<span style="display:inline-block;min-width:80px;border-bottom:2px solid var(--primary);text-align:center;font-size:12px;color:var(--muted)">${multi?gapN:'&nbsp;'}</span>`;});
  const esc=s=>s.replace(/'/g,"\\'");
  const opts=[...item.opts].sort(()=>Math.random()-.5);
  openModal(ex.title,`
    <div class="mprog"><div class="mprog-f" style="width:${i/total*100}%"></div></div>
    <div class="mmeta">${i+1} / ${total}</div>
    <div class="qq"><div class="q-txt">${sent}</div></div>
    <div class="opts">${opts.map(o=>`<button class="opt" onclick="gapPick(this,'${esc(o)}','${esc(item.blank)}','${esc(item.fb||'')}','${esc(item.sent)}')">${o}</button>`).join('')}</div>
    <div class="fb" id="gfb"></div>`);
}
function gapPick(btn,chosen,correct,fbText,sentRaw){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const accepted=correct.split('|');
  const ok=accepted.includes(chosen);btn.classList.add(ok?'ok':'no');
  if(!ok)document.querySelectorAll('.opt').forEach(b=>{if(accepted.includes(b.textContent.trim()))b.classList.add('ok');});
  const fb=document.getElementById('gfb');
  const bareSent=(sentRaw||'').replace(/^[A-Z][A-Z\s()→]*:\s*/,'').replace(/\s*\([^)]*\)/g,'').replace(/\s{2,}/g,' ').trim();
  const nGaps=(bareSent.match(/_____/g)||[]).length;
  let sentWithAns=null;
  if(nGaps>1){
    const parts=accepted[0].split(' / ');
    if(parts.length===nGaps){let s=bareSent;parts.forEach(p=>{s=s.replace('_____',`<u>${p}</u>`);});sentWithAns=s;}
  }
  if(sentWithAns===null){
    const answered=accepted.map(a=>`<u>${a}</u>`).join(' / ');
    sentWithAns=bareSent.includes('_____')?bareSent.replace('_____',answered):answered;
  }
  const explain=(!ok&&fbText)?`<div style="margin-top:10px;font-size:13px;font-weight:400;color:var(--text)">${fbText}</div>`:'';
  fb.innerHTML=ok?'✓ Ondo!':'✗ Zuzena: "'+sentWithAns+'"'+explain+'<br><button class="btn-continue" onclick="exNext()">Segi →</button>';
  fb.className='fb '+(ok?'ok':'no');
  if(ok){S.ex.score++;setTimeout(exNext,800);}
}

function drawMcEx(ex,i){
  const q=ex.q[i],total=ex.q.length;
  const esc=s=>s.replace(/'/g,"\\'");
  const opts=[...q.opts].sort(()=>Math.random()-.5);
  openModal(ex.title,`
    <div class="mprog"><div class="mprog-f" style="width:${i/total*100}%"></div></div>
    <div class="mmeta">${i+1} / ${total}</div>
    <div class="qq"><div class="q-lbl">Galdera</div><div class="q-txt">${q.q}</div></div>
    <div class="opts">${opts.map(o=>`<button class="opt" onclick="mcPick(this,'${esc(o)}','${esc(q.a)}')">${o}</button>`).join('')}</div>
    <div class="fb" id="mcfb"></div>`);
}
function mcPick(btn,chosen,correct){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ok=chosen===correct;btn.classList.add(ok?'ok':'no');
  if(!ok)document.querySelectorAll('.opt').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('ok');});
  const fb=document.getElementById('mcfb');
  fb.innerHTML=ok?'✓ Ondo!':'✗ Zuzena: '+correct+'<br><button class="btn-continue" onclick="exNext()">Segi →</button>';
  fb.className='fb '+(ok?'ok':'no');
  if(ok){S.ex.score++;setTimeout(exNext,800);}
}

function drawTf(ex,i){
  const item=ex.items[i],total=ex.items.length;
  const fit=t=>t.length>34?'fc-sm':t.length>22?'fc-md':'';
  openModal(ex.title,`
    <div class="mprog"><div class="mprog-f" style="width:${i/total*100}%"></div></div>
    <div class="mmeta">${i+1} / ${total}</div>
    <div class="fcw" onclick="${S.ex.flip?'':'tfFlip()'}" style="cursor:${S.ex.flip?'default':'pointer'}"><div class="fc ${S.ex.flip?'flip':''}" id="tffc">
      <div class="fcf fc-a">
        <div class="fc-lb">Egia ala gezurra?</div>
        <div class="fc-w ${fit(item.stmt)}">${item.stmt}</div>
        <div class="fc-h">👆 Sakatu erantzuna ikusteko</div>
      </div>
      <div class="fcf fc-b">
        <div class="fc-lb">Erantzuna</div>
        <div class="fc-tr">${item.a?'✅ Egia':'❌ Gezurra'}</div>
        ${item.fb?`<div style="margin-top:10px;font-size:14px;font-weight:500;color:var(--text)">${item.fb}</div>`:''}
      </div>
    </div></div>
    <div class="hint">👆 Sakatu txartela · gero: 😕 Berriz / 👍 Ongi</div>
    <div class="fcc" id="tffcc" style="display:${S.ex.flip?'flex':'none'}">
      <button class="fcb fcb-a" onclick="tfAns(false)">😕 Berriz</button>
      <button class="fcb fcb-g" onclick="tfAns(true)">👍 Ongi</button>
    </div>`);
}
function tfFlip(){const fc=document.getElementById('tffc');if(!fc)return;S.ex.flip=true;fc.classList.add('flip');document.getElementById('tffcc').style.display='flex';}
function tfAns(right){
  if(right)S.ex.score++;
  S.ex.flip=false;
  exNext();
}

/* ── SEARCH ── */
function openSearch(){document.getElementById('so').classList.add('on');document.getElementById('si').value='';document.getElementById('sr').innerHTML='';setTimeout(()=>document.getElementById('si').focus(),100);}
function closeSearch(){document.getElementById('so').classList.remove('on');}
function soClick(e){if(e.target.id==='so')closeSearch();}
function doSearch(q){
  const r=document.getElementById('sr');if(!q.trim()){r.innerHTML='';return;}
  const results=UNIT.vocabulary.filter(w=>w.eu.toLowerCase().includes(q.toLowerCase())||w.es.toLowerCase().includes(q.toLowerCase())).slice(0,20);
  if(!results.length){r.innerHTML=`<div class="sr-em">Emaitzarik ez "${q}"</div>`;return;}
  r.innerHTML=results.map(w=>`<div class="sri"><span class="srb">${secLbl(w.section)}</span><div><div class="sr-eu">${hl(w.eu,q)}</div><div class="sr-es">${hl(w.es,q)}</div></div></div>`).join('');
}
function hl(text,q){const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');return text.replace(re,'<mark>$1</mark>');}

function exIcon(t){return{'mc':'🎯','gap-mc':'✍️','truefalse':'⚖️','flip':'🃏','match-pairs':'🔗','sequence':'🔢'}[t]||'📝';}
function exTypeName(t){return{'mc':'Aukera anitza','gap-mc':'Osatu hutsuneak','truefalse':'Egia ala gezurra','flip':'Itzulpen txartelak','match-pairs':'Lotu bikoteak','sequence':'Ordenatu'}[t]||'Ariketa';}

document.addEventListener('keydown',e=>{
  /* "Segi →" button (wrong-answer feedback): ArrowRight or Enter presses it */
  const cont=document.querySelector('.btn-continue');
  if(cont&&(e.key==='ArrowRight'||e.key==='Enter')){e.preventDefault();cont.click();return;}
  /* practice flashcards: space/enter = flip, ← = berriz, → = ongi */
  if(S.ex?.mode==='flash'){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();return;}
    if(S.ex.flip){
      if(e.key==='ArrowRight'){e.preventDefault();fcAns('g');return;}
      if(e.key==='ArrowLeft'){e.preventDefault();fcAns('a');return;}
    }
  }
  /* flip/truefalse exercises: space/enter = flip, ← = berriz, → = ongi */
  if(S.ex?.mode==='ex'&&(S.ex.ex.type==='flip'||S.ex.ex.type==='truefalse')){
    if((e.key===' '||e.key==='Enter')&&!S.ex.flip){e.preventDefault();tfFlip();return;}
    if(S.ex.flip){
      if(e.key==='ArrowRight'){e.preventDefault();tfAns(true);return;}
      if(e.key==='ArrowLeft'){e.preventDefault();tfAns(false);return;}
    }
  }
  /* azterketa: space/enter = flip, ← = ez, → = bai */
  if(EXAM&&S.view==='azterketa'){
    const c=EXAM.cards[EXAM.i];
    if((e.key===' '||e.key==='Enter')&&!c.flipped){e.preventDefault();examFlip();return;}
    if(c.flipped&&c.picked===null){
      if(e.key==='ArrowRight'){e.preventDefault();examSelf(true);return;}
      if(e.key==='ArrowLeft'){e.preventDefault();examSelf(false);return;}
    }
  }
  if(e.key==='Escape'){closeModal();closeSearch();}
});

renderUnitSelector();
updateUnitChrome();
renderGramSub();
renderAzterSub();
render();

/* ── SIDEBAR RESIZER ── drag the right edge of the sidebar to adjust its width */
(function(){
  const sb=document.getElementById('sb'),rz=document.getElementById('sb-rz');
  if(!sb||!rz)return;
  const MIN=170,MAX=440;
  const saved=load('b21_sbw',null);
  if(saved)sb.style.width=Math.max(MIN,Math.min(MAX,saved))+'px';
  let dragging=false;
  rz.addEventListener('mousedown',e=>{
    e.preventDefault();dragging=true;
    rz.classList.add('dragging');document.body.classList.add('sb-resizing');
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const w=Math.max(MIN,Math.min(MAX,e.clientX));
    sb.style.width=w+'px';
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;
    rz.classList.remove('dragging');document.body.classList.remove('sb-resizing');
    save('b21_sbw',parseInt(sb.style.width,10));
  });
  /* double-click resets to default */
  rz.addEventListener('dblclick',()=>{sb.style.width='250px';save('b21_sbw',250);});
})();
</script>
