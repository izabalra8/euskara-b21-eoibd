<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euskara B2.1 — 01 UDARA JOAN DA ETA...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--sidebar:#05080b;--sidebar-dark:#020406;--sidebar-hover:#0c1520;
  --primary:#00f5c8;--primary-dark:#00c9a4;--accent:#ff2ccb;--card:#0d1117;
  --purple:#a855f7;--purple-dark:#7c1fe0;--turq-dark:#00958a;--turq-deep:#037c8c;--blue:#4d8cff;
  --success:#39ff7a;--danger:#ff2255;--text:#d8e4f0;--muted:#4a6070;
  --border:#141e28;--shadow:0 2px 16px rgba(0,245,200,.05);
  --shadow-lg:0 8px 40px rgba(0,245,200,.13);--r:12px;--rs:8px;
  --glow-c:rgba(0,245,200,.18);--glow-a:rgba(255,44,203,.18);--glow-p:rgba(168,85,247,.18);
}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:17px;line-height:1.6;background-image:radial-gradient(ellipse 80% 60% at 70% 0%,rgba(0,245,200,.04) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 10% 100%,rgba(255,44,203,.04) 0%,transparent 60%),radial-gradient(ellipse 45% 35% at 95% 90%,rgba(168,85,247,.05) 0%,transparent 60%)}
#sb{width:250px;background:var(--sidebar);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid var(--border)}
#sb-rz{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:10;background:transparent;transition:background .15s}
#sb-rz:hover,#sb-rz.dragging{background:rgba(0,245,200,.25)}
body.sb-resizing{user-select:none;cursor:col-resize}
#sb-h{padding:22px 20px 14px;border-bottom:1px solid var(--border)}
#logo{font-family:'Orbitron',sans-serif;font-size:21px;font-weight:800;letter-spacing:.5px;color:var(--primary);text-shadow:0 0 18px rgba(0,245,200,.5)}
#logo b{color:var(--accent);text-shadow:0 0 18px rgba(255,44,203,.5)}
#lvl{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-top:5px;font-family:'Orbitron',sans-serif;font-weight:400}
#unit-sel{font-size:11.5px;margin-top:10px;padding:6px 26px 6px 10px;background:rgba(0,245,200,.06);border:1px solid rgba(0,245,200,.15);border-radius:6px;font-weight:600;display:block;width:100%;color:var(--primary);letter-spacing:.3px;font-family:'Jost',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4" stroke="%2300f5c8" stroke-width="1.4" fill="none"/></svg>');background-repeat:no-repeat;background-position:right 10px center}
#unit-sel:hover{background-color:rgba(0,245,200,.12)}
#unit-sel:focus{outline:none;border-color:var(--primary)}
#unit-sel option{background:var(--sidebar);color:var(--text)}
#sbtn{margin:12px 20px;width:calc(100% - 40px);background:rgba(0,245,200,.06);border:1px solid rgba(0,245,200,.15);border-radius:var(--rs);color:rgba(0,245,200,.65);padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;font-family:'Jost',sans-serif}
#sbtn:hover{background:rgba(0,245,200,.12);color:var(--primary);box-shadow:0 0 12px rgba(0,245,200,.1)}
#nav{flex:1;padding:6px 0}
#nav label{display:block;padding:10px 20px 4px;font-size:9.5px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(0,245,200,.3);font-family:'Orbitron',sans-serif;font-weight:400}
.nb{width:100%;background:none;border:none;color:rgba(208,228,240,.6);padding:9px 20px;cursor:pointer;display:flex;align-items:center;gap:11px;text-align:left;transition:.15s;border-left:3px solid transparent;font-family:'Jost',sans-serif;font-size:15px}
.nb:hover{background:var(--sidebar-hover);color:var(--primary);border-left-color:rgba(0,245,200,.3)}
.nb.on{background:rgba(0,245,200,.07);color:var(--primary);border-left-color:var(--primary);box-shadow:inset 0 0 20px rgba(0,245,200,.04)}
.nb-ic{width:24px;text-align:center;flex-shrink:0;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.nb-tx{flex:1;min-width:0}
.nb-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-s{font-size:11px;color:var(--muted)}
.nb-caret{font-size:10px;color:var(--muted);flex-shrink:0;transition:.2s;margin-left:4px}
.nb-caret.open{transform:rotate(180deg)}
#gram-sub,#azter-sub{display:none;flex-direction:column;padding-left:14px;border-left:1px solid var(--border);margin:2px 0 4px 30px}
#gram-sub.open,#azter-sub.open{display:flex}
.nb-sub{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);font-size:12px;font-family:'Jost',sans-serif;padding:7px 8px;cursor:pointer;border-radius:6px;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-sub:hover{background:var(--sidebar-hover);color:var(--primary)}
.nb-sub.on{color:var(--purple);font-weight:600}
#n-gramatika.on{background:rgba(168,85,247,.08);color:var(--purple);border-left-color:var(--purple);box-shadow:inset 0 0 20px rgba(168,85,247,.05)}
#n-gramatika:hover{color:var(--purple);border-left-color:rgba(168,85,247,.35)}
#sb-f{padding:14px 20px;border-top:1px solid var(--border)}
#stats{display:flex;gap:14px}
.st{text-align:center;flex:1}
.st-n{font-size:17px;font-weight:800;color:var(--primary);display:block;line-height:1.2;font-family:'Orbitron',sans-serif;text-shadow:0 0 12px rgba(0,245,200,.4)}
.st-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
#main{flex:1;min-width:0;padding:30px 34px 60px;max-width:960px}
.ph{margin-bottom:22px}
.ph-tag{display:inline-block;background:var(--accent);color:#fff;padding:3px 11px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.8px;margin-bottom:8px;text-shadow:0 0 8px rgba(255,44,203,.5);box-shadow:0 0 12px rgba(255,44,203,.25);font-family:'Orbitron',sans-serif}
.ph h1{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:800;color:var(--primary);line-height:1.25;text-shadow:0 0 20px rgba(0,245,200,.3)}
.ph p{color:var(--muted);margin-top:8px;max-width:70ch;font-weight:300}
.card{background:var(--card);border-radius:var(--r);padding:22px;margin-bottom:15px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-h{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:700;color:var(--primary);margin-bottom:5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;letter-spacing:.3px}
.pill{background:rgba(0,245,200,.1);color:var(--primary);padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;border:1px solid rgba(0,245,200,.2)}
.pill-g{background:rgba(57,255,122,.1);color:var(--success);border-color:rgba(57,255,122,.2)}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:14px;font-style:italic;font-weight:300}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:22px}
.sec-card{background:var(--card);border-radius:var(--r);padding:19px;cursor:pointer;border:1px solid var(--border);transition:.25s;box-shadow:var(--shadow)}
.sec-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 0 24px var(--glow-c),var(--shadow-lg)}
.sec-lbl{display:inline-block;background:rgba(0,245,200,.12);color:var(--primary);padding:3px 10px;border-radius:6px;font-weight:800;font-size:11px;margin-bottom:10px;border:1px solid rgba(0,245,200,.2);font-family:'Orbitron',sans-serif;letter-spacing:.4px}
.sec-t{font-weight:700;font-size:15px;color:var(--text)}
.sec-p{font-size:11px;color:var(--muted);margin-top:2px}
.sec-d{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45;font-weight:300}
.sec-bar{height:3px;background:var(--border);border-radius:4px;margin-top:12px;overflow:hidden}
.sec-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--purple),var(--accent));transition:width .4s;box-shadow:0 0 6px var(--primary)}
.sec-n{font-size:11px;color:var(--primary);font-weight:700;margin-top:7px}
.obj-list{margin-top:18px}
.obj{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.obj:last-child{border-bottom:none}
.obj-n{width:22px;height:22px;background:var(--primary);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;margin-top:1px;box-shadow:0 0 8px rgba(0,245,200,.4)}
.tabs{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:var(--r);margin-bottom:20px;box-shadow:var(--shadow);flex-wrap:wrap;border:1px solid var(--border)}
.tb{flex:1;min-width:110px;padding:9px 10px;border:none;background:none;border-radius:var(--rs);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);transition:.2s;font-family:'Jost',sans-serif;letter-spacing:.3px}
.tb:hover{background:rgba(0,245,200,.06);color:var(--primary)}
.tb.on{background:rgba(0,245,200,.12);color:var(--primary);box-shadow:0 0 12px rgba(0,245,200,.1);border:1px solid rgba(0,245,200,.2)}
.vc-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:12px;font-weight:600;transition:.15s;color:var(--muted);font-family:'Jost',sans-serif}
.chip:hover{border-color:rgba(0,245,200,.4);color:var(--primary)}
.chip.on{background:rgba(0,245,200,.1);border-color:var(--primary);color:var(--primary);box-shadow:0 0 8px rgba(0,245,200,.15)}
.vlist{display:grid;gap:8px}
.vrow{background:var(--card);border-radius:10px;padding:12px 15px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);border:1px solid var(--border);border-left:3px solid transparent;transition:.15s}
.vrow:hover{border-color:rgba(0,245,200,.2);border-left-color:transparent}
.vrow.done{border-left-color:var(--success)}
.vrow.hard{border-left-color:var(--danger)}
.veu{font-weight:700;font-size:17px;color:var(--primary);min-width:165px}
.varr{color:var(--border);flex-shrink:0}
.ves{flex:1;font-size:14px;color:var(--muted)}
.vpg{font-size:10px;color:var(--muted);background:rgba(0,245,200,.06);padding:2px 7px;border-radius:10px;flex-shrink:0;border:1px solid var(--border)}
.vacts{display:flex;gap:6px;flex-shrink:0}
.vab{width:28px;height:28px;border:none;background:rgba(255,255,255,.03);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:.15s;color:var(--muted);border:1px solid var(--border)}
.vab:hover{background:rgba(0,245,200,.08);border-color:rgba(0,245,200,.3);color:var(--primary)}
.vab.fav{color:var(--accent);background:rgba(255,44,203,.08);border-color:rgba(255,44,203,.2)}
.vab.dif{color:var(--danger);background:rgba(255,34,85,.08);border-color:rgba(255,34,85,.2)}
.vab.ok{color:var(--success);background:rgba(57,255,122,.08);border-color:rgba(57,255,122,.2)}
/* ── MAILA-ARGITZEA: zenbat eta hobeto jakin, orduan eta argiagoa txartela ── */
.vrow.ml1{background:#151e28}
.vrow.ml2{background:#243040}
.vrow.ml3{background:#46525f}
.vrow.ml3 .ves{color:#b3bfca}
.vrow.ml3 .varr{color:#5e6b78}
.vrow.lit{border-color:transparent}
.vrow.ml4{background:#9daab6}
.vrow.ml5{background:#e4e9ee;box-shadow:0 2px 16px rgba(228,233,238,.10)}
.vrow.lit .veu{color:#00695a;text-shadow:none}
.vrow.lit .ves{color:#323c46;font-weight:500}
.vrow.lit .varr{color:rgba(0,0,0,.3)}
.vrow.lit .vpg{color:#33414d;background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.14)}
.vrow.lit .due{color:#4a5560;background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.14)}
.vrow.lit .vab{background:rgba(255,255,255,.4);border-color:rgba(0,0,0,.15);color:#4a5560}
.vrow.lit .vab.fav{color:#c2189a;background:rgba(255,44,203,.12)}
.vrow.lit .vab.dif{color:#d40f44;background:rgba(255,34,85,.10)}
.vrow.lit .vab.ok{color:#0d8a44;background:rgba(57,255,122,.14)}
.vrow.lit .dot{background:rgba(0,0,0,.18)}
.vrow.lit .dot.on{background:#0d8a44;box-shadow:none}
.vrow.lit:hover{border-color:rgba(0,105,90,.35)}
.vrow.lit.done{border-left-color:#0d8a44}
.vrow.lit.hard{border-left-color:#d40f44}
.mlegend{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted);margin:0 0 14px;flex-wrap:wrap}
.mlegend .msw{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.mlegend .msw i{width:24px;height:13px;display:block}
.gtable{width:100%;border-collapse:collapse;font-size:15.5px;margin:12px 0}
.gtable th{background:rgba(0,245,200,.08);color:var(--primary);padding:8px 11px;text-align:left;font-weight:700;font-size:12px;border-bottom:1px solid rgba(0,245,200,.2);font-family:'Orbitron',sans-serif;letter-spacing:.4px}
.gtable td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text)}
.gtable tr:last-child td{border-bottom:none}
.gtable tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.gtable.light{background:#f4f1ea;border-radius:8px;overflow:hidden}
.gtable.light th{background:#e4dfd0;color:#1a1712;border-bottom:1px solid #d5cfbd}
.gtable.light td{color:#2a251d;border-bottom:1px solid #e0dbca}
.gtable.light tr:nth-child(even) td{background:rgba(0,0,0,.03)}
.gtable.light tr:last-child td{border-bottom:none}
.gexp{color:var(--text);font-size:14px;margin-bottom:14px;line-height:1.6;font-weight:300}
.gexp b{color:var(--primary);font-weight:700}
.gex-box{background:rgba(168,85,247,.05);border-left:3px solid var(--purple);border-radius:0 var(--rs) var(--rs) 0;padding:13px 16px;margin-top:12px}
.gex-box h4{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--purple);margin-bottom:9px;font-family:'Orbitron',sans-serif;font-weight:600}
.gex{margin-bottom:9px}
.gex:last-child{margin-bottom:0}
.gex-eu{font-weight:600;color:var(--text);font-size:14px}
.gex-eu b{color:var(--primary);background:rgba(0,245,200,.1);padding:0 4px;border-radius:3px;border:1px solid rgba(0,245,200,.2)}
.gex-es{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:1px}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px;margin-top:12px}
.gli{background:rgba(0,245,200,.03);border-radius:var(--rs);padding:9px 12px;font-size:13px;border:1px solid var(--border)}
.gli:hover{border-color:rgba(0,245,200,.2)}
.gli b{color:var(--primary);display:block;font-size:13.5px}
.gli span{color:var(--muted);font-size:12px}
.ggroup{margin-top:14px}
.ggroup-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.ggroup-row .ggroup{flex:0 1 200px;margin-top:0;min-width:0}
.ggroup h5{display:block;width:100%;font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid rgba(0,245,200,.15);font-family:'Orbitron',sans-serif}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:22px}
.ex-topic{border:1px solid var(--border);border-radius:var(--r);padding:14px 14px 16px;margin-bottom:13px;background:rgba(168,85,247,.02)}
.ex-topic:last-child{margin-bottom:0}
.ex-topic-h{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--purple);font-family:'Orbitron',sans-serif;margin-bottom:11px}
.ex-card{background:var(--card);border-radius:var(--r);padding:18px 15px;cursor:pointer;border:1px solid var(--border);transition:.25s;text-align:center;box-shadow:var(--shadow)}
.ex-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 0 20px var(--glow-c),var(--shadow-lg)}
.ex-ic{font-size:27px;margin-bottom:7px}
.ex-n{font-weight:700;font-size:13px;color:var(--primary);font-family:'Orbitron',sans-serif;letter-spacing:.2px}
.ex-d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;font-weight:300}
#ov{display:none;position:fixed;inset:0;background:rgba(2,4,8,.8);z-index:1000;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
#ov.on{display:flex}
#md{background:var(--card);border-radius:18px;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;box-shadow:0 0 60px rgba(0,245,200,.12),var(--shadow-lg);border:1px solid rgba(0,245,200,.1)}
#md-h{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:5;border-radius:18px 18px 0 0}
#md-t{font-weight:800;font-size:15px;color:var(--primary);font-family:'Orbitron',sans-serif;letter-spacing:.3px}
#md-x{width:30px;height:30px;border:none;background:rgba(255,255,255,.04);border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s;border:1px solid var(--border)}
#md-x:hover{background:rgba(255,34,85,.1);color:var(--danger);border-color:rgba(255,34,85,.3)}
#md-b{padding:22px}
.mprog{background:var(--border);height:3px;border-radius:4px;margin-bottom:20px;overflow:hidden}
.mprog-f{height:100%;background:linear-gradient(90deg,var(--primary),var(--purple),var(--accent));transition:width .3s;box-shadow:0 0 6px var(--primary)}
.mmeta{text-align:center;color:var(--muted);font-size:13px;margin-bottom:15px;font-weight:300}
.fcw{perspective:1000px;width:100%;height:190px;margin-bottom:18px;cursor:pointer}
.fc{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.fc-a{background:linear-gradient(135deg,#001e1a 0%,#003328 50%,rgba(0,245,200,.15) 100%);border:1px solid rgba(0,245,200,.25);color:#fff;box-shadow:0 0 30px rgba(0,245,200,.1) inset}
.fc-b{background:linear-gradient(135deg,#1a001a 0%,#330020 50%,rgba(255,44,203,.15) 100%);border:1px solid rgba(255,44,203,.25);color:#fff;transform:rotateY(180deg);box-shadow:0 0 30px rgba(255,44,203,.1) inset}
.fc-lb{font-size:9.5px;text-transform:uppercase;letter-spacing:1.5px;opacity:.5;margin-bottom:13px;font-family:'Orbitron',sans-serif}
.fc-w{font-size:32px;font-weight:800;line-height:1.25;color:var(--primary);text-shadow:0 0 20px rgba(0,245,200,.4)}
.fc-h{font-size:12px;opacity:.5;margin-top:10px}
.fc-tr{font-size:24px;font-weight:700;line-height:1.35;color:#ff80bf;text-shadow:0 0 20px rgba(255,44,203,.4)}
.fc-en{font-size:11px;opacity:.6;margin-top:8px}
.fcf.mfc1{box-shadow:inset 0 0 0 999px rgba(228,233,238,.09)}
.fcf.mfc2{box-shadow:inset 0 0 0 999px rgba(228,233,238,.20)}
.fcf.mfc3{box-shadow:inset 0 0 0 999px rgba(228,233,238,.34)}
.fcf.mfc4{box-shadow:inset 0 0 0 999px rgba(228,233,238,.55)}
.fcf.mfc5{box-shadow:inset 0 0 0 999px rgba(228,233,238,.75)}
.fcf.mdark{color:#101820}

    {id:'idazlan-eredua-01',title:'Idazlanaren eredua: gutun formala',subtitle:'HABE B2, GAI kalifikazioa — ikaslearen jatorrizko testua, zuzenketarik gabe (Oarsoaldeko AEK, 2020)',use:'idazlana',section:'01c',page:'HABE',
     explanation:'<div class="gexp" style="font-weight:300;line-height:1.7"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">Kanpinak badu zer hobetu</div><div style="font-style:normal">Bilbo, 2020ko ekainaren 18a<br><br>Laredoko kanpineko arduradun agurgarri hori:<br><br>Ezer baino lehen, nire burua aurkeztuko dut. Ni Igor Astiz naiz, donostiarra naiz, eta urtero zure kanpinera joaten naiz nire familiarekin egun batzuk pasatzera, izan ere, asko gustatzen zaigu hiriaren zaratatik urruntzea. Eta gutun honen bidez jakinarazi nahi nizkizuke jarduera-eskaintzaren inguruan sortutako kezka batzuk.<br><br>Hasteko, esan beharra dago, nik ez nuela kanpina ezagutzen, baina orain dela lauzpabost urte nire koadrilako bati ikusitako argazki batzuei esker zuen berri izan nuen. Gainera, geroago irratsaio batean iragarki bat entzun nuen eta azkenean nire emaztearekin hitz egin ondoren animatu ginen joatera.<br><br>Hasieran, oso eroso geunden aurkitutako guztiarekin, baina egunak pasa ahala, konturatu ginen espero genuena eta bertan ikusitakoa bat ez zetorrela. Alde batetik, kirola egiteko instalazioak nahiz igerilekuak asko gustatu zitzaizkigun. Garbitasuna asko nabaritzen zen eta dena berria izango balitz bezala ikusten zen. Baina beste aldetik, eskainitako jarduerak, gure ustez, ez-nahikoak ziren.<br><br>Dakizunez, web-orrian eta irratian diozue muturreko kirolak egiteko aukera paregabea dela, eta helduak kirolean aritzen garen bitartean gure umeak zaintzeko pertsonak dituzuela, baina hau ez da egia. Muturreko kirol bakarra ibai batetik behera kanoa batekin jaistea da, eta gure umeekin egoteko emakume bakarra dago. Beraz, ez gaude batere ados aipatutakoarekin.<br><br>Horregatik, hurrengo urterako hobetu ahal izateko bi proposamen ekartzen dizkizut. Lehenengoa, eta garrantzitsuena, bezeroei gezurrik ez esatea da. Hau da, eskaintzen duzuena eta guk aurkitzen duguna parekoak izatea. Eta bukatzeko, zuen jarduera-eskaintza hobetzea, adibidez, bizikletan ateratzeko taldeak osatzea edota txikientzako antzerkiak antolatzea.<br><br>Besterik gabe, esandakoari kasu egingo duzulakoan, mila esker zure denboragatik.<br><br>Igor Astiz</div></div>'
    },

    {id:'euskara-biok-ereduak-02',title:'Idazlanaren ereduak: Euskara eta biok',subtitle:'Euskara-ikasleen benetako testigantzak (Berria, 2013)',use:'idazlana',section:'02c',page:'Berria',
     explanation:'<div class="gexp" style="font-weight:300;line-height:1.7"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">1. eredua — Rosa Pili Abrisketa (Laudio, Araba)</div><div style="font-style:normal">Nire semeari lagundu nahi izateak bultzatu ninduen. Semea jaio baino lehen ez neukan inolako harremanik euskararekin; beraz, semea eskolan hasitakoan, konturatu nintzen komenigarria izango zela nik euskara ikastea berari laguntzeko, berak euskaraz ikasten baitzuen. Hasi nintzen euskara ikasten inolako titulurik lortzeko asmorik gabe; hori dela eta, asmo ezberdinak dituen talde bat sortu genuen. Hots, ikasteaz gain hainbat ekintza egiten ditugu, hala nola: mendirako irteerak, txango kulturalak, bazkariak... Beraz, hauxe da gehien gustatzen zaidana, gauza desberdinak egiteko aukera izatea.<br><br>Nire ustez, egunero klasera joan behar izatea izan daiteke ahalegina, batez ere bizi garen garaiotan, jendea gauza askotan aritzen baita aldi berean. Baina, gogoz egiten baduzu, ez dut uste ahalegin handirik suposatzen duenik. Halaber, hizkuntza bera ezagutzeaz gain, euskarak geure bizitzan zer suposatzen duen ere ulertu dut. Horrekin batera, egin daitezkeen lagun berriak, harreman sozialak... dira euskaltegira joateak eman didana.</div><hr style="border:none;border-top:1px solid var(--border);margin:16px 0"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">2. eredua — Veronica Lopez Alegre (Dulantzi, Araba)</div><div style="font-style:normal">Nahiz eta bidea erraza ez izan, azkenean euskaraz ikastea lortu dut. Prozesu hori esaldi batean laburbil dezaket: hasieran beharra, gero ohitura, eta orain bizimodua. Lehenengo kontaktua oso gogorra izan zen, zerotik hastea ez da erraza. Gaur egun, ordea, elkarrizketa mantentzeko gai izatea oso atsegina da, ahaleginak merezi du.</div></div>'
    },

    {id:'argudio-ereduak-03',title:'Idazlanaren ereduak: argudio testua',subtitle:'Bi eredu oso (unitateko 14. orria)',use:'idazlana',section:'03c',page:'14',
     explanation:'<div class="gexp" style="font-weight:300;line-height:1.7"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">1. eredua — Sare sozialak</div><div style="font-style:normal">Sare sozialak dira gaur egungo eztabaidetan gehien jotzen duten gaietako bat. Hori gertatzen da, mundu osoko jendearen arteko konexio ildo konplexua sortu eta publizitatearen garapenean lagundu duten arren, egia da hauen gehiegizko erabilerak jendeari kalte handia egiten diola ere.<br><br>Izan ere, izen handiko hainbat unibertsitatetako ikerketek —Harvardek eta Cambridgek, esaterako— lortu dute sare sozialek hainbat nahaste kognitibo eragiten dituztela erakustea, batez ere gazteenen artean. Sintomen artean, antsietatea, mendekotasuna, insomnioa eta segurtasunik eza bezalako arazoak diagnostikatu dira.<br><br>Hau ziberjazarpena kontatu gabe, planeta osoko ehunka mila lagunekin gertatzen dena. Arazo hau konpontzeko, instituzioek sare sozialen erabilera kontzientea sustatzen duten ekimenak sortu behar dituzte.</div><hr style="border:none;border-top:1px solid var(--border);margin:16px 0"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">2. eredua — Murrizketak irakaskuntzan</div><div style="font-style:normal">Nolakoa izango litzateke gure etorkizuna murrizketek aurrera jarraitzen baldin badute irakaskuntza zapalduz? Krisi honen ondorioz murrizketa ugari egiten ari dira gizarteko arlo askotan. Nire iritziz, baina, osasun eta irakaskuntza arloak ukiezinak izan beharko lirateke haien ikaragarrizko garrantzia dela eta. Irakaskuntzarik gabeko gizartea, ezjakina dena, engainatzeko oso erraza da, eta horrek manipulatzeko erraztasun handiagoa ematen du etorkizuneko arazoak erakarriz.<br><br>Murrizketak izaten ari diren ondorioen adibide oso garbi bat gaur egun eskola publikoetako edozein geletan argi eta garbi ikus dezakegu. Murrizketak direla eta, gero eta material txarragoak —ezin dira berriak erosi— eta ikasle gehiago daude klaseetan. Horrela, irakasleen lana asko zailtzen da. Horrez gain, ikasle asko dauden klaseetan, askoz errazagoa da beraien arreta galtzea. Horren guztiaren ondorioz, nahita nahiez, irakaskuntza maila jaitsi egiten da eta ikasleek ikasteko zailtasunak dituzte eta beraien emaitzak jaisten dira.<br><br>Honi guztiari gehitu behar zaio matrikulen prezioak garestiagoak izatea, gehienbat unibertsitateen kasuan. Gero eta gehiago dira unibertsitatera joan ezin diren gazteak, matrikulak oso garestiak direlako eta gero eta beka gutxiago eskaintzen direlako. Eta noski, zer gertatuko da gazte horiek guztiak unibertsitatera joan ezin badira? Ezingo direla ondo prestatu. Eta zer gertatuko da ez badago ondo prestatutako gazterik? Bizi diren herrialde hori ezin izango dela behar den moduan garatu, eta beste herrialdeekiko atzerapen izugarria izango duela gero.<br><br>Honekin guztiarekin esan nahi dudana zera da, nahiz eta ulertu krisiagatik beharrezkoa dela murrizketak egitea, irakaskuntza eta osasuna ez direla ukitu behar. Arlo hauetan murrizketaren bat egitekotan, behar-beharrezkoa bakarrik egin beharko litzateke; irakaskuntza gizartearen oinarrizkoa den zerbait da, gure eskubidea da irakaskuntza publiko on bat izatea, krisia(k) egon ala ez.</div></div>'
    }

    {id:'esker-gutun-ereduak-04',title:'Esker gutunaren ereduak',subtitle:'Bi eredu oso, B2.1 mailakoak',use:'idazlana',section:'04c',page:'16 · Berria',
     explanation:'<div class="gexp" style="font-weight:300;line-height:1.7"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">1. eredua — Aitonari, euskara estimatzen irakatsi zidan gizon prestu eta ausartari <span style="font-weight:400;color:var(--muted)">(unitateko 16. orria · 200 hitz, azterketa-luzera)</span></div><div style="font-style:normal">Aitona maitea:<br><br>Aspaldi joan zinen, nik 13 bat urte edo izango nituela hil baitzinen. Eta, egia esan, urte mordoxka bat joan dira alde egin zenuenetik, ene!, eta hala eta guztiz ere, zenbatetan aipatu ote zaitudan…<br><br>Lagun eta ezagunek aitona edota amona bizirik dutela entzutean, barruak nahasten zaizkit oraindik. Inbidiak jota gelditzen naiz horrelakoetan, pentsatzen zer egingo nukeen nik orain alboan edukiko bazintut, zenbat galdera egingo nizkizukeen, hitz hau edo hura nola esango zenukeen euskaraz!<br><br>Izan ere, ume mukizu hark asko galdu zuen zure heriotzarekin. Nork kontatuko zizkidan ordutik aurrera gerra garaiko pasadizo haiek? Nor egongo zen etxean gurasoak ez zeudenean? Nori kontatuko nizkion neure barruko kontu haiek? Nor etorriko zitzaidan ikastolara bila? Nork eramango gintuen lagunen baserri eta etxeetara, alegia, mundu zahar haietara?<br><br>Zu izan baitzinen euskarazko ipuinak kontatzen zizkidana… zuri ikasia da bertsolaritzarekiko zaletasuna, antzerkiarekiko interesa, euskararekiko maitasuna eta bitxia badirudi ere, dotore janztearen garrantzia.<br><br>Hori guztia eta gehiago zor dizut, attona. Bihotzez eskertzen dizut irakatsitako guztia, nahiz errietaren bat edo beste merezi ez nuela ere sentitzen dudan.<br><br>Txikiegia nintzen damurik edukitzeko. Beraz, damua baino pena dut zure pasadizoak grabatu ez izanaz.</div><hr style="border:none;border-top:1px solid var(--border);margin:16px 0"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">2. eredua — Esker gutuna <span style="font-weight:400;color:var(--muted)">(Kontxi Agirre, Pello Epelde eta Aiora Epelde · Berria, Zuzendariari, 2013 — unitateko 14. orriko ariketaren jatorrizko bertsio osoa)</span></div><div style="font-style:normal">Gutunaren bidez azken urte gogor honetan gure ondoan egon zareten guztioi, babestu gaituzuen guztioi, Eperi maitasuna eta estimazioa azaldu diozuen guztioi… gure eskerrik beroenak eman nahi dizkizuegu.<br><br>Urtea latza izan da. Eperi minbizia diagnostikatu ziotenetik aurrera, borroka konstantea izan da. Bizi nahi izatearen kontzientziak bultzaturik, azken unera arte borrokatu baitu.<br><br>Gaixotasunaren aurrean egoki kokatzea zaila izaten da, gaixotasunaren etapak bizitzea gogorra da, eta gaixotasunak hiltzera eramango gaituela lasaitasunez barneratzea ariketa konplikatua da… Guretzat beharrezkoa izan da bidea egoki egitea. Eta bidea egokitea ezinezkoa litzateke Donostia Ospitaleko Etxeko Ospitalizazioa unitate paliatiboko ekipoaren laguntzarik eta babesik gabe. Mila esker, Epe etxera eramatea posible egiteagatik, eta bere azken egunak bere txokoan, bere gauzen ondoan eta bereetaz inguratuta bizitzea posible egin ahal izateagatik.<br><br>Mila esker, Eperen egoeraren aurrean erakutsi duzuen humanotasunagatik. Gu zaintzeko eta babesteko egin duzuen ahaleginagatik. Ez dugu sekula ahaztuko, ondo-ondoan sentitu baitzaituztegu. Mila esker, Eperen heriotza duintzeagatik.<br><br>Mila esker, heriotza jaiotza bera bezain naturala dela pentsamenduari ateak zabaldu, eta maite ditugun pertsonen agurra modu maitekiro batean garatzen laguntzeagatik. Mila esker, bihotz-bihotzetik!</div></div>'
    }
  ],

    {id:'aholku-eredua-05',title:'Idazlanaren eredua: aholku testua',subtitle:'"Ikasteko aholkuak" (unitateko 13. orria · euskaljakintza)',use:'idazlana',section:'05c',page:'13',
     explanation:'<div class="gexp" style="font-weight:300;line-height:1.7"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">Ikasteko aholkuak</div><div style="font-style:normal">Jadanik azterketa garaia iritsi da eta ziur nago zuetako askok azkeneko unerako utzi duzuela ikasi beharrekoa.<br><br>Pilaketa honek hainbat ondorio ekar ditzake. Batetik, gure burua gutxiesten dugu, dena ikasteko gai ez garela izango pentsatzen dugu eta larritu egiten gara. Aldi berean, larritasun eta estres horrek ez digu ikasten uzten. Sentimendu hauek guztiak behin eta berriro errepikatzen dira eta konturatu garenerako gaueko 12ak dira eta jada ez dago ezer egiterik.<br><br>Hau gerta ez dadin oso garrantzitsua da erlaxatzea. Ez dago inongo errezeta magikorik ikasteko, baina zenbait ohitura izateak kontzentratzen lagunduko digu:<br><br>— Ahaztu bizitza pertsonaleko kontuak, ikasi behar duzun gaian zentratu eta ez izan pesimista.<br>— Urduri bazaudete, hartu arnasa sakon sudurretik, segundo gutxi batzuetan eutsi horri eta, azkenik, poliki-poliki ahotik edo sudurretik bota. Horrela erlaxatzea lortuko duzue.<br>— Ikasi behar dugun lekua egokitu behar dugu: gela aireztatua eduki, argia behar bezala, arreta galaraziko diguten elementuak kendu…<br>— Erabateko isiltasuna lortzea ezinezkoa da. Baina adituek diote lagungarria dela musika instrumentala jartzea edo behin eta berriz errepikatzen den soinu bat edukitzea. Esate baterako, erloju batena. Denbora tarte bat pasa ondoren, soinu horretara ohituko gara eta ez diogu jaramonik egingo; horrela, kontzentratu ahal izango dugu.<br>— Azkenik, ez da gomendagarria ordu asko jarraian ikasten jardutea. Orduko 10 minutu telebista, internet edo horrelakoekin ikasketak ahaztea gomendatzen da.</div></div>'
    }
  ],

     explanation:'<ul class="gexp" style="margin:6px 0 10px 20px"><li><b>1. Izen zenbakaitzek</b> (haizea, beroa, mina, kafea, umorea...) ez dute BAT onartzen: Haize handi<b>A</b> dabil · Bero ikaragarri<b>A</b> egiten du. <span style="font-size:13px;color:rgba(216,228,240,.75)">(Baina zenbatu daitekeenean: Zer hartu duzue? Kafe <b>BAT</b> eta tortila <b>BAT</b>.)</span></li><li><b>2. IZAN aditzaren osagarria</b> bada → <b>-A</b>: Gasteiz hiri atsegin<b>A</b> da · Aizkorri mendi altu<b>A</b> da.</li><li><b>3. Kontzeptua bera</b> denean → <b>-A</b>: Hori ez da letxug<b>A</b>, az<b>A</b> baizik.</li><li><b>4. Hizketan</b>: <b>-A</b> = artikulu zehaztua (Hartu biziklet<b>A</b> — badakigu zein) · <b>BAT</b> = zehaztugabea (Hartu bizikleta <b>BAT</b> — edozein).</li></ul>',

     explanation:'<div class="gexp" style="font-weight:300;line-height:1.7"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">1. eredua — Petra, bere burua hil nahi zuen 90 bat urteko dama <span style="font-weight:400;color:var(--muted)">(1. pertsonako pasadizoa, unitateko 8. orria)</span></div><div style="font-style:normal">Arratsaldea zen, egun sargoritsu horietakoa. Oihuka sumatu nituen hoteleko hainbat turista, igerileku baten inguruan, denak gora begira izututa. Petra zen, eta bere burua balkoitik behera bota nahi zuela zirudien, eta bota baino lehen bere logelan nengoen. Nola sartu behar nuen erabakitzeko astirik ere ez nuen ia hartu. Azkarregi sartzen banintzen logelan, bazitekeen Petra ikaratzea, eta jauzi egitea.<br><br>Mantsoegi sartzen banintzen, izan zitekeen beranduegi. Beraz, ez bata eta ez bestea... Hori bai: hizketan hasi nintzaion, xuabe, goxo, bere ama-hizkuntzan, alemanez. Esan nion ez egiteko halakorik, jendeak maite zuela. Eta erregutu, nik ez dakit zenbat aldiz erregutu nion: luzatzeko eskua niri. Suhiltzaileak hotelera zetozela ere esan nion, eta polizia, eta anbulantzia. Hori entzutean irribarre maltzur batekin erantzun zidan:<br><br>"Oporretako nire egunik ederrena da hauxe. Den-denak engainatu zaituztet, ez dut hiltzeko asmorik, guztiei jo dizuet adarra!" Begira, une hartantxe burutik pasa ere egin zitzaidan, neuk botako nuela atsoa balkoitik behera, bultzaka. Ea igerilekuaren kontra burua txiki-txiki egiten zuen!</div><hr style="border:none;border-top:1px solid var(--border);margin:16px 0"><div style="font-weight:700;color:var(--primary);margin-bottom:6px">2. eredua — Franco hil zen eguna <span style="font-weight:400;color:var(--muted)">(pasadizo laburra, Eñauten itzulpena — konpletiboak, zehar galderak eta lehenaldiko baldintza)</span></div><div style="font-style:normal">Uste dut pasadizo hau Franco hil zen egun berean gertatu zela, gogoratzen baitut nire amari galdetu niola ea egun tristea ala alaia zen. Berak esan zidan egun oso alaia zela, baina egia esan nik ez neukan hain argi, etxean denek barre egiten eta ospatzen zutelako eta kalean, ordea, denak serio-serio zeudelako. Nik ez nekien zer egin, egia esan. Gustatuko zitzaidakeen ulertzea, ni txikiegia nintzen.</div></div>'

/* ── UNIT SWITCHING ──
   UNIT is a mutable pointer into UNITS[]. Progress/exams/mnemonics are kept
   fully separate per unit — every storage key is namespaced with UNIT.key
   via uk(), and switchUnit() reloads all of it when you change units. */
const MEM={};let STORE_OK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch{STORE_OK=false;}
function load(k,d){try{return JSON.parse(STORE_OK?localStorage.getItem(k):MEM[k])??d;}catch{return d;}}
function save(k,v){const s=JSON.stringify(v);MEM[k]=s;if(STORE_OK){try{localStorage.setItem(k,s);}catch{STORE_OK=false;}}}
function uk(suffix){return UNIT.key+'_'+suffix;}

let curUnitIdx=load('b21_active_unit',0);
if(!(curUnitIdx>=0&&curUnitIdx<UNITS.length))curUnitIdx=0;
let UNIT=UNITS[curUnitIdx];
let P,LOG,EXAMS,MNEMO,MNEMO_SKIP,EXAMLEN,LEN,DIR;
function loadUnitState(){
  P=load(uk('progress'),{});
  LOG=load(uk('log'),{sessions:0,reviews:0,right:0,lastSession:null});
  EXAMS=load(uk('exams'),[]);
  MNEMO=load(uk('mnemo'),{});
  MNEMO_SKIP=load(uk('mnemo_skip'),[]);
  EXAMLEN=load(uk('examlen'),10);
  LEN=load(uk('len'),20);
  DIR=load(uk('dir'),'mix');
}
loadUnitState();
/* Global exam state — NOT per-unit (shared across all units, score-only) */
let GEXAMS=load('b21_global_exams',[]);
let GEXAMLEN=load('b21_global_examlen',10);
function switchUnit(idx){
  idx=Number(idx);
  if(idx===UNITS.indexOf(UNIT)||!UNITS[idx])return;
  if(CLOCK){clearInterval(CLOCK);CLOCK=null;}
  EXAM=null;S.ex=null;
  document.getElementById('ov')?.classList.remove('on');
  UNIT=UNITS[idx];
  curUnitIdx=idx;
  save('b21_active_unit',idx);
  loadUnitState();
  S.view='home';S.filter='all';S.sort='book';
  updateUnitChrome();
  renderGramSub();
  window.scrollTo(0,0);
  render();
}
function renderUnitSelector(){
  const sel=document.getElementById('unit-sel');
  if(!sel)return;
  sel.innerHTML=UNITS.map((u,i)=>`<option value="${i}">${u.num} · ${u.title}</option>`).join('');
  sel.value=UNITS.indexOf(UNIT);
}
function updateUnitChrome(){
  document.title=`Euskara ${UNIT.level} — ${UNIT.num} ${UNIT.title.toUpperCase()}`;
  const sel=document.getElementById('unit-sel');
  if(sel)sel.value=UNITS.indexOf(UNIT);
}

  'lehiakortasun':'Hitza zatituta, benetako etimologia da: <b>lehia</b> (competencia, rivalidad, carrera) + <b>-kor</b> (joera adierazten duen atzizkia: "-ivo/-tivo", hunkikor=emotivo bezala) + <b>-tasun</b> (izenondo abstraktua sortzen duen atzizkia: "-idad/-eza"). Lehia+kor+tasun = "izaera lehiakorra izatea" = competitividad. (Hau ez da asmatutako lotura — benetako hitz-eraketa da.)',

  'hirigintza':'Benetako hitz-eraketa: <b>hiri</b> (ciudad) + <b>-gintza</b> (atzizkia, "egin" aditzetik dator eta "actividad de crear/hacer algo" adierazten du: langintza=trabajo/artesanía). Hiri+gintza = "hiria egiteko jarduera" = urbanismo. (Hau ez da asmatutako lotura — benetako hitz-eraketa da.)',

  'lehia':'"Lehia" (competencia, rivalidad, afán) barruan <b>lehen</b> (primero, antes) hitzaren erroa dago. Lehiatzea = "lehena" izan nahi izatea, besteak baino aurretik iristeko gogoa = competir por ser el primero. (Kontuz: hau nire proposamen bat da, ez dut hiztegi etimologiko batean egiaztatu — baina "lehen"-ekin duen antzekotasun fonetikoa gogoratzeko lagungarria da.)',
  'musutruk':'Etimologia: musu (beso) + truk (trueke, "a cambio de"). Literalki "a cambio de un beso" → hain merke/doan dagoena, ezer ordaindu gabe = gratis.',

  'etekin':'"Etekin" (beneficio/rédito) — begira barruan "<b>EKIN</b>" (afrontarse, dedicarse a, esforzarse) hitza dagoela. Etekina lortzeko <b>ekin</b> egin behar diozu zerbaiti: esfuerzoa jarri, eta hortik dator errendimendua/onura. "El beneficio que sale de PONERTE a ello / esforzarte." (Lotura hau ez dut hizkuntzalaritza-iturri batean egiaztatu — baliteke benetako etimologia bestelakoa izatea, baina "ekin" ikustea gogoratzeko lagungarria da.)',
  'ondare':'"Ondare" (patrimonio/herencia) hasten da <b>ON</b>-ekin — "on" euskaraz "bueno" da. Ondarea zure aurrekoek utzitako gauza <b>on</b>ak dira: patrimonioa/herentzia = "lo bueno" que heredas. (Lotura kontzeptuala, ez etimologia egiaztatua — hitzaren jatorri zehatza ez dago berretsita.)',
  'eredu':'"Eredu" (modelo/ejemplo) fonetikoki <b>"heredero"</b> gaztelaniazko hitzaren antzekoa da. Pentsa: eredu bat jarraitzea da norbaiten "herencia"/tradizioa jasotzea eta hari erreferentzia gisa jarraitzea — "el modelo que heredas y sigues". (Lotura fonetiko/asmatua, ez etimologia erreala — hau ez da hizkuntzalaritza-iturri batean egiaztatu.)<br><br><i>Beste aukera bat:</i> "eredu" barruan <b>"ERE"</b> dago, gaztelaniazko <b>"RE-"</b> aurrizkiaren (repetir, reproducir) antzekoa. Eredu bat jarraitzean, gauza bera <b>ERE</b>-eta-<b>ERE</b> egiten duzu, patroi berari jarraituz — "algo que se RE-produce/RE-pite" = modelo. (Hau ere lotura fonetiko asmatua da, ez etimologia egiaztatua.)',
  'elebakar':'Benetako hitz-eraketa: <b>ele</b> (hizkuntza, "lengua/idioma" — euskara zaharreko hitza) + <b>bakar</b> (único, solo). Ele+bakar = "hizkuntza bakarrekoa" = monolingüe. Familia berekoak: <b>elebidun</b> (ele+bi+dun = bilingüe), <b>eleaniztun</b> (ele+anitz+dun = políglota). (Hau ez da asmatutako lotura — benetako hitz-eraketa da.)',
  'behatoki':'Benetako hitz-eraketa: <b>behatu</b> (observar, mirar atentamente) + <b>-toki</b> (lugar: jantoki=comedor, aparkatoki=aparcamiento bezala). Behatu+toki = "observatzeko tokia" = observatorio. (Hau ez da asmatutako lotura — benetako hitz-eraketa da.)',
  'menperatu':'"Menperatu" (dominar) barruan <b>menpe</b> dago (bajo el dominio/dependencia de: "norbaiten menpe egon" = estar bajo el control de alguien — gogoratu <b>mendekotasun</b> = dependencia, familia berekoa). Menperatu = norbait/zerbait zure <b>menpe</b> jartzea = dominarlo. Adib.: euskara menperatu = dominar el euskera. (Benetako hitz-familia da: menpe → menperatu → mendekotasun.)',
  'ele':'"Ele" (lengua/idioma) gogoratzeko: <b>ELE</b>bakar, <b>ELE</b>bidun, <b>ELE</b>aniztun — hiru hitz ezagun horiek guztiek "ele" daramate aurrean, eta hirurak hizkuntza-kopuruari buruzkoak dira (mono/bi/multi-lingüe). Beste hook bat: gaztelaniazko "<b>ELE</b>" (Español como Lengua Extranjera) ere hizkuntza bati buruzkoa da. (Lehenengo lotura benetakoa da; bigarrena kasualitate mnemotekiko hutsa.)',
  'behatu':'"Behatu" (observar) gogoratzeko: <b>BEHA</b>toki = observatorio, "behatzeko tokia". Eta pentsa <b>behi</b> bat <b>beha</b>: una vaca mirándote fijamente sin pestañear — "la BEHIa te oBSErva". (Behatoki-lotura benetakoa da; behiarena asmatutako irudi mnemotekiko hutsa.)',
  'ustekabe':'Benetako hitz-eraketa: <b>uste</b> (creencia, opinión — "uste dut" = creo que) + <b>-kabe/gabe</b> (sin). Uste+kabe = "uste GABEKOA", esperar/creer gabe gertatzen dena = imprevisto, sorpresa. "Lo que llega SIN que lo creyeras". Familia berekoa: <b>ustekabean</b> = de improviso, por sorpresa. (Hau ez da asmatutako lotura — benetako hitz-eraketa da.)',
  'aitzakia':'"Aitzakia" (excusa) gogoratzeko: fonetikoki gaztelaniazko <b>"ahí + saqué + ya"</b> entzun daiteke — "¡ahí saqué ya una excusa!". Edo pentsa: <b>AITZ</b>-akia — aitz (peña/roca) baten atzean <b>ezkutatzen</b> zara excusa bat bezala, "esconderse detrás de una roca/excusa". (Biak asmatutako lotura mnemotekiko hutsak dira, ez etimologia erreala.)',
  'eta jakina...':'"Eta jakina..." (y desde luego...) barruan <b>jakin</b> (saber) dago: <b>jakina</b> = "lo sabido", denok dakiguna, ageri-agerikoa dena. "Y, como es SABIDO..." = "y desde luego / por supuesto". Gogoratu "jakina!" bakarrik ere erabiltzen dela: "¡claro!, ¡por supuesto!". (Benetako lotura da: jakin → jakina.)',
  'maskorra':'"Maskorra" (concha) gogoratzeko: fonetikoki <b>"máscara"</b> hitzaren oso antzekoa da — eta kontxa bat itsas animaliaren <b>máscara/armadura</b> da, kanpoko estalki gogorra. "La MÁSCARA dura del molusco" = maskorra. (Asmatutako lotura mnemotekiko hutsa, ez etimologia egiaztatua.)',
  'sustatu':'"Sustatu" (promover, fomentar) barruan <b>sustrai</b> (raíz) hitzaren "susta-" erroa ikus daiteke: zerbait sustatzea da hari <b>sustraiak</b> ematea, errotu eta haz dadin — "dar RAÍCES a algo para que crezca" = fomentarlo. Kontuz ez nahasteko <b>suNtsitu</b>-rekin (destruir): susTAtu = fomentar, suNTSItu = destruir — ia kontrakoak! (Sustrai-lotura ez dago etimologikoki egiaztatuta, baina gogoratzeko lagungarria da.)',
  'altzari':'"Altzari" (mueble) gogoratzeko: pentsa <b>"ALZAR"</b> gaztelaniazko aditzean — etxe berrira mudantzan, altzariak <b>alzatu/altxatu</b> behar dira ("¡ALZA ese armario!"). Euskarazko <b>altxatu</b> (levantar) ere hor dago oihartzun gisa: altzariak = "las cosas que hay que ALZAR" mudantzan. (Asmatutako lotura fonetikoa, ez etimologia egiaztatua.)',
  'demagun':'Benetako hitz-eraketa: <b>eman</b> aditzaren subjuntibo trinkoa da, guk formarekin: <b>demagun</b> = "demos (por supuesto)" — gaztelaniaz ere berdin esaten da: "DEMOS por hecho que..." = supongamos. Gainera, fonetikoki "DEMOS+gun" entzuten da. Sinonimoa: <b>jo dezagun</b> (jo = golpear/considerar → "consideremos"). (Eman-en forma trinkoa izatea benetakoa da.)',
  'arau':'"Arau" (norma, regla) gogoratzeko: pentsa <b>ARAUGINTZA</b> hitzean (normativa, creación de normas — zure ERE ariketen webgunearen izena!) edo <b>arautegi</b> (reglamento). Beste hook bat: fonetikoki "a RAYA" entzun daiteke — arauek jendea <b>"a raya"</b> mantentzen dute ("las normas te mantienen A RAYA"). (Lehen lotura benetakoa da — arau da erroa; "a raya" asmatutako lotura fonetikoa da.)',
  'susmo':'"Susmo" (sospecha, presentimiento) gogoratzeko: fonetikoki gaztelaniazko <b>"SoSpecha"</b>-ren antz handia du — biek <b>SUS-/SOS-</b> hasiera dute. Pentsa: "tengo la SUSpecha" → susmoa dut. Irudi bat nahi baduzu: susmo bat duzunean, zerbait <b>susurru</b> (murmullo) bat bezala dabilkizu buruan. (Asmatutako lotura fonetikoak, ez etimologia egiaztatua.)',
  'murrizketa':'Benetako hitz-eraketa: <b>murriztu</b> (reducir, recortar) + <b>-keta</b> (ekintza-atzizkia: konparaketa, hausnarketa bezala). Gogoratzeko hook fonetikoa: "murriztu" barruan <b>"MURO"</b> entzun daiteke — recorte bat dagoenean, <b>muro/pareta</b> baten kontra jotzen duzu, ezin aurrera egin. "Los recortes te ponen un MURO." (Murriztu+keta eraketa benetakoa da; "muro"-rena asmatutako lotura fonetikoa.)',
  'hunkitu':'"Hunkitu" (emocionarse, conmoverse) gogoratzeko: fonetikoki <b>"un KIT"</b> entzun daiteke — pentsa pelikula triste bat ikusteko <b>"un KIT de pañuelos"</b> behar duzula, hunkituko zarelako. Edo beste hook bat: <b>UN-KI-TU</b> ≈ "UNa KOsa Interior TocadU" — zerbait barrutik <b>ukitzen</b> zaituenean, hunkitu egiten zara ("ukitu" eta "hunkitu" oso antzekoak dira — lo que te TOCA por dentro te CONMUEVE). (Ukitu/hunkitu antzekotasuna gogoratzeko baliagarria da; loturak asmatuak dira, ez etimologia egiaztatua.)',
  'aniztasun':'Benetako hitz-eraketa: <b>anitz</b> (mucho/a, vario/a — hitz zaharra: "esker anitz" = mila esker!) + <b>-tasun</b> (izenondo abstraktua: "-idad/-eza", edertasun bezala). Anitz+tasun = "izaera anitza" = diversidad. Familia berekoa: <b>eleaniztun</b> (ele+ANITZ+dun = políglota, hizkuntza ANITZ dituena). (Hau ez da asmatutako lotura — benetako hitz-eraketa da.)',
  'herdoildu':'"Herdoildu" (oxidarse/oxidado) gogoratzeko: <b>herdoil</b> = óxido/herrumbre. Fonetikoki gaztelaniazko <b>"HERRUMBRE"</b>-ren antza du — biak <b>HER-</b> hasten dira: HERdoil ↔ HERrumbre. Irudia: burdina zahar bat <b>HERIDO</b> dago, "herido por el óxido" — herdoilduta. (HER- lotura fonetiko hutsa da, ez etimologia egiaztatua; herdoil→herdoildu eraketa benetakoa da.)',
  'bermatu':'"Bermatu" (garantizar) gogoratzeko: <b>berme</b> = garantía/aval (hitz erreala: "bi urteko bermea" = garantía de dos años, dendetan ikusten dena!). Berme+atu = bermatu, "poner garantía" = garantizar. Hook fonetikoa: <b>BERMe ↔ FIRMe</b> — garantizatzen duzunak zerbait <b>firme</b> uzten du, edo pentsa "AVAL" ematen duzula <b>BERMa</b>tzean. (Berme→bermatu eraketa benetakoa da; firme/aval loturak asmatuak dira.)',
  'sarritan':'"Sarritan" (a menudo) gogoratzeko: <b>sarri</b> = frecuente/a menudo + <b>-tan</b> (aldi-atzizkia: batzue<b>tan</b>, askο<b>tan</b> bezala). Hook fonetikoa: pentsa gauza bat <b>SARRItan</b> gertatzen dela "como una SARTa de veces" — sarta bat, bata bestearen atzetik, behin eta berriz. Sinonimoak gogoratu: sarritan = <b>askotan</b> = <b>maiz</b>. (Sarri+tan eraketa benetakoa da; "sarta" lotura asmatua.)',
  'arduratsu':'"Arduratsu" (responsable) hitz-eraketa garbia da: <b>ardura</b> (responsabilidad, cuidado) + <b>-tsu</b> ("lleno de" atzizkia: euri<b>tsu</b>=lluvioso, mendi<b>tsu</b>=montañoso bezala). Ardura+tsu = "lleno de responsabilidad" = responsable. Familia osoa gogoratu: <b>arduratu</b> (ocuparse), <b>arduradun</b> (encargado). Hook fonetikoa "ardura"-rentzat: responsabilitatea ez da pasatzen, <b>DURA</b> eta dura — "la responsabilidad te DURA". (Ardura+tsu benetako eraketa da; "dura" lotura asmatua.)',
  'hasperen':'"Hasperen" (suspiro) gogoratzeko: <b>HAS-</b> hasten da, <b>hats</b> (aliento, respiración) hitzaren oihartzuna — suspiro bat hats/arnasa luze bat da. Irudia: "HAS PEREN(a)" — <b>Perengatik suspiratzen</b> duzu: "¡suspiras por Peren(a)!". Edo pentsa suspiro batekin zerbait <b>HASten</b> dela beti — maitasun istorio bat, adibidez. (Hats-lotura sinesgarria da baina ez egiaztatua; besteak asmatutako irudi mnemotekiko hutsak.)',
  'abeltzain':'Benetako hitz-eraketa: <b>abere</b> (animal, ganado; abel- forma elkartuetan) + <b>-zain</b> (cuidador/guardián). Abel+zain = "el que cuida el ganado" = ganadero. Familia osoa gogoratu: <b>artzain</b> (ardi+zain = pastor), <b>atezain</b> (ate+zain = portero), <b>haurtzain</b> (canguro), <b>ertzain</b> (herri+zain = policía vasca!). (Hau ez da asmatutako lotura — benetako hitz-eraketa da.)',
  'xahutu':'"Xahutu" (derrochar, malgastar) gogoratzeko: fonetikoki <b>"txau!"</b> entzuten da — dirua xahutzen duzunean, <b>"¡chau, dinero!"</b> esaten diozu, agur betiko. Irudia: poltsikoa zabaldu eta dirua <b>xa-xa-xa</b> ihesi doa. Gogoratu Unit 1eko esaldia: "Zuri loteria tokatuko balitzaizu, txorakeriatan <b>xahutuko</b> zenuke". (Asmatutako lotura fonetiko hutsa, ez etimologia egiaztatua.)'
};
function hardWordsList(){
  const skip=new Set(MNEMO_SKIP);
  const out=[];
  UNIT.vocabulary.forEach(w=>{
    const r=wp(w.eu);
    if(skip.has(w.eu))return;
    if(r.d||(r.wrong>0&&(r.right+r.wrong)>=2))out.push({w,r});
  });
  return out.sort((a,b)=>{
    const aa=accuracy(a.r),ba=accuracy(b.r);
    const av=aa===null?-1:aa,bv=ba===null?-1:ba;
    if(av!==bv)return av-bv;
    return b.r.wrong-a.r.wrong;
  });
}
function setMnemo(eu,text){if(text.trim())MNEMO[eu]=text.trim();else delete MNEMO[eu];save(uk('mnemo'),MNEMO);}
function mnemoSkip(eu){if(!MNEMO_SKIP.includes(eu))MNEMO_SKIP.push(eu);save(uk('mnemo_skip'),MNEMO_SKIP);render();}
let EXAM=null;let CLOCK=null;
const BLANK={lv:0,seen:0,right:0,wrong:0,streak:0,last:0,due:0,f:false,d:false};
const DAY=86400000;
const IVL=[0,1,3,7,16,35];

function wp(eu){return{...BLANK,...(P[eu]||{})};}
function setwp(eu,u){P[eu]={...wp(eu),...u};save(uk('progress'),P);}
function isLearned(r){return r.lv>=3;}
function accuracy(r){const n=r.right+r.wrong;return n?r.right/n:null;}
function isDue(r){return r.seen>0&&r.due<=Date.now();}

const STREAK_K=[1,.95,.8,.25,.15,.08];
function weight(w){
  const r=wp(w.eu);
  if(!r.seen)return 1.6;
  const a=accuracy(r);let k=.5+3.5*(1-a);
  if(r.d)k*=2.5;
  k*=STREAK_K[Math.min(r.streak,5)];
  if(r.lv>=4)k*=.5;
  if(isDue(r))k*=1+Math.min(2,(Date.now()-r.due)/(3*DAY));
  else k*=.5;
  return Math.max(k,.02);
}
function weightedOrder(ws){return ws.map(w=>({w,k:-Math.log(Math.random())/weight(w)})).sort((a,b)=>a.k-b.k).map(x=>x.w);}

function rec(eu,correct,hard){
  const r=wp(eu),now=Date.now();
  const u={seen:r.seen+1,last:now};
  if(correct){u.right=r.right+1;u.streak=r.streak+1;u.lv=Math.min(5,r.lv+1);if(r.d&&u.streak>=3)u.d=false;}
  else{u.wrong=r.wrong+1;u.streak=0;u.lv=Math.max(0,r.lv-2);if(hard)u.d=true;}
  u.due=now+IVL[u.lv]*DAY;
  setwp(eu,u);
  LOG.reviews++;if(correct)LOG.right++;save(uk('log'),LOG);
}

function stats(){
  let tot=UNIT.vocabulary.length,lrn=0,fav=0,hard=0,due=0,newW=0;
  UNIT.vocabulary.forEach(w=>{const x=wp(w.eu);if(isLearned(x))lrn++;if(x.f)fav++;if(x.d)hard++;if(isDue(x))due++;if(x.seen===0)newW++;});
  return{tot,lrn,fav,hard,due,newW};
}
function secProgress(sid){
  const ws=UNIT.vocabulary.filter(w=>w.section===sid);
  if(!ws.length)return 0;
  return Math.round(ws.filter(w=>isLearned(wp(w.eu))).length/ws.length*100);
}

const LVNAME=['Berria','Hasiera','Ikasten','Badakit','Ondo','Menperatua'];
function secLbl(id){if(id==='all')return'Guztiak';const s=UNIT.sections.find(x=>x.id===id);return s?s.label:id;}
function secIcon(id){const s=UNIT.sections.find(x=>x.id===id);return s&&s.icon?s.icon:'';}

/* ── CHROME ── */
function renderChrome(){
  const st=stats();
  document.getElementById('s-tot').textContent=st.tot;
  document.getElementById('s-lrn').textContent=st.lrn;
  document.getElementById('s-fav').textContent=st.fav;
  document.getElementById('nv-count').textContent=st.tot+' hitz';
  const gramCount=UNIT.grammar.filter(g=>g.use!=='idazlana').length;
  const idazCount=UNIT.grammar.filter(g=>g.use==='idazlana').length;
  document.getElementById('nv-gram').textContent=gramCount+' egitura';
  document.getElementById('nv-idaz').textContent=idazCount+' formula';
  document.getElementById('nv-azter').textContent=EXAMS.length?EXAMS.length+' azterketa':'';
  const mnCount=Object.keys(MNEMO).length;
  document.getElementById('nv-mnemo').textContent=mnCount?mnCount+' idatzita':hardWordsList().length+' hitz zail';
  document.getElementById('nv-due').textContent=st.due?st.due+' berrikusteko':st.newW?st.newW+' hitz berri':'Dena eguneratuta';
  ['home','maila','hiztegia','gramatika','idazlana','ariketak','azterketa','mnemo'].forEach(v=>{
    const el=document.getElementById('n-'+v);
    if(el)el.classList.toggle('on',S.view===v);
  });
}
function go(v){if(v!=='azterketa'&&CLOCK){clearInterval(CLOCK);CLOCK=null;EXAM=null;}S.view=v;window.scrollTo(0,0);render();}
function newSession(){const now=Date.now();if(!LOG.lastSession||now-LOG.lastSession>30*60000)LOG.sessions++;LOG.lastSession=now;save(uk('log'),LOG);}

/* ── MARK HTML ── */
function markHTML(r,mode){
  const dots=[0,1,2,3,4].map(i=>`<i class="dot ${i<r.lv?'on':''}"></i>`).join('');
  if(mode==='dots')return`<span class="mark">${dots}</span>`;
  const a=accuracy(r);
  const acc=a===null?'':`<span class="acc ${a>=.8?'a-hi':a>=.5?'a-mid':'a-lo'}">${Math.round(a*100)}%</span>`;
  return`<span class="mark" title="${LVNAME[r.lv]}·${r.seen} berrikuspen">${dots}${acc}</span>`;
}
function dueLabel(r){if(!r.seen)return'';const d=Math.ceil((r.due-Date.now())/DAY);if(d<=0)return'<span class="due">orain</span>';return`<span class="due dq">${d}e</span>`;}

/* ── RENDER ── */
function render(){
  renderChrome();
  const v=document.getElementById('view');
  if(S.view==='home')v.innerHTML=vHome();
  else if(S.view==='maila')v.innerHTML=vMaila();
  else if(S.view==='hiztegia')v.innerHTML=vHiztegia();
  else if(S.view==='gramatika')v.innerHTML=vGramatika();
  else if(S.view==='idazlana')v.innerHTML=vIdazlana();
  else if(S.view==='ariketak')v.innerHTML=vAriketak();
  else if(S.view==='azterketa')v.innerHTML=vAzterketa();
  else if(S.view==='mnemo')v.innerHTML=vMnemo();
  else if(S.view.startsWith('sec-'))v.innerHTML=vSection(S.view.slice(4));
}

/* ── VIEWS ── */
function vHome(){return`
  <div class="ph">
    <div class="ph-tag">UNITATEA ${UNIT.num} · ${UNIT.level}</div>
    <h1>${UNIT.title}</h1>
    <p>${UNIT.intro}</p>
  </div>
  <div class="card">
    <div class="card-h">🎯 Unitatearen helburu nagusiak</div>
    <div class="obj-list">${UNIT.objectives.map((o,i)=>`<div class="obj"><div class="obj-n">${i+1}</div><div>${o}</div></div>`).join('')}</div>
  </div>
  <div class="sec-grid">${UNIT.sections.map(s=>{
    const p=secProgress(s.id);const n=UNIT.vocabulary.filter(w=>w.section===s.id).length;
    return`<div class="sec-card" onclick="go('sec-${s.id}')">
      <div class="sec-lbl">${s.label}</div>
      <div class="sec-t">${secIcon(s.id)} ${s.title}</div>
      <div class="sec-p">${s.pages}. orrialdeak</div>
      <div class="sec-d">${s.desc}</div>
      <div class="sec-n">${n} hitz · ${p}%</div>
      <div class="sec-bar"><div class="sec-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join('')}</div>`;}

function vSection(sid){
  const s=UNIT.sections.find(x=>x.id===sid);
  const words=UNIT.vocabulary.filter(w=>w.section===sid);
  const gram=UNIT.grammar.filter(g=>g.section===sid);
  const exs=UNIT.exercises.filter(e=>e.skill==='gramatika'&&e.section===sid);
  const p=secProgress(sid);
  return`
  <div class="ph">
    <div class="ph-tag">${s.label} · ${s.pages}. or.</div>
    <h1>${secIcon(s.id)} ${s.title}</h1>
    <p>${s.desc}</p>
  </div>
  <div class="card">
    <div class="card-h">Aurrerapena <span class="pill">${p}%</span></div>
    <div class="sec-bar" style="margin-top:4px"><div class="sec-fill" style="width:${p}%"></div></div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="chip" onclick="startFlash('${sid}')">🃏 Txartelak (${words.length})</button>
      <button class="chip" onclick="startQuiz('${sid}')">🎯 Galdetegia</button>
    </div>
  </div>
  ${gram.length?`<div class="card">
    <div class="card-h">📐 Gramatika <span class="pill">${gram.length}</span></div>
    ${gram.map(g=>gramHTML(g)).join('<hr style="border:none;border-top:1px solid var(--border);margin:20px 0">')}
  </div>`:''}

function uniformSample(arr,n){
  const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);
}
function setExamLen(n){EXAMLEN=n;save(uk('examlen'),n);render();}
function setGExamLen(n){GEXAMLEN=n;save('b21_global_examlen',n);render();}
function examLenChips(){return[10,20,40].map(n=>`<button class="chip ${EXAMLEN===n?'on':''}" onclick="setExamLen(${n})">${n} galdera</button>`).join('');}
function gExamLenChips(){return[10,20,40].map(n=>`<button class="chip ${GEXAMLEN===n?'on':''}" onclick="setGExamLen(${n})">${n} galdera</button>`).join('');}
function buildExamCards(n,unitsArr){
  n=n||10;
  const units=unitsArr||[UNIT];
  const multi=units.length>1;
  const pre=u=>multi?('U'+u.num+' · '):'';
  const cards=[];
  // ~50% vocabulary flashcards
  const vocPool=[];
  units.forEach(u=>u.vocabulary.forEach(w=>vocPool.push({w,u})));
  const nVoc=Math.min(Math.round(n*0.5),vocPool.length);
  uniformSample(vocPool,nVoc).forEach(({w,u})=>{
    const eu2es=Math.random()<0.5;
    cards.push({type:'vocab',label:pre(u)+(eu2es?'Euskaraz → Gaztelaniaz':'Gaztelaniaz → Euskaraz'),
      front:eu2es?w.eu:w.es, back:eu2es?w.es:w.eu, w:multi?null:w, flipped:false, picked:null});
  });
  // ~50% grammar + idazlana flashcards — from exercises + idazlana groups
  const gramPool=[];
  units.forEach(u=>{
  u.exercises.forEach(ex=>{
    if(ex.type==='gap-mc'&&ex.items){
      ex.items.forEach(item=>{
        const hasBlank=item.sent.includes('_____');
        const bareSent=item.sent.replace(/^[A-Z][A-Z\s()→]*:\s*/,'').replace(/\s*\([^)]*\)/g,'').replace(/\s{2,}/g,' ').trim();
        const blankDisp=item.blank.includes('|')?item.blank.split('|').join(' / '):item.blank;
        const full=hasBlank?bareSent.replace('_____',`<b><u>${blankDisp}</u></b>`):`<b><u>${blankDisp}</u></b>`;
        gramPool.push({type:'grammar',label:pre(u)+(ex.skill==='idazlana'?'Formulak · ':'Gramatika · ')+ex.title,
          front:item.sent, back:full, w:null, flipped:false, picked:null});
      });
    }
    if(ex.type==='mc'&&ex.q){
      const lbl=pre(u)+(ex.skill==='idazlana'?'Formulak · ':'Gramatika · ')+ex.title;
      ex.q.forEach(qi=>{
        gramPool.push({type:'grammar',label:lbl,
          front:qi.q, back:`<b>${qi.a}</b>`, w:null, flipped:false, picked:null});
      });
    }
    if(ex.type==='truefalse'&&ex.items){
      const lbl=pre(u)+'Gramatika · '+ex.title;
      ex.items.forEach(it=>{
        const back=(it.a?'✅ Egia':'❌ Gezurra')+(it.fb?' — '+it.fb:'');
        gramPool.push({type:'grammar',label:lbl,
          front:it.stmt, back, w:null, flipped:false, picked:null});
      });
    }
    if(ex.type==='flip'&&ex.items){
      const lbl=pre(u)+(ex.skill==='idazlana'?'Formulak · ':'Gramatika · ')+ex.title;
      ex.items.forEach(it=>{
        gramPool.push({type:'grammar',label:lbl,
          front:it.front, back:`<b>${it.back}</b>`, w:null, flipped:false, picked:null});
      });
    }
  });
  u.grammar.filter(g=>g.use==='idazlana').forEach(g=>{
    (g.groups||[]).forEach(gr=>{
      gr.items.forEach(item=>{
        gramPool.push({type:'grammar',label:pre(u)+'Formulak · '+gr.label,
          front:item.es, back:item.eu, w:null, flipped:false, picked:null});
      });
    });
  });
  });
  const nGram=Math.min(n-nVoc,gramPool.length);
  let sampled=uniformSample(gramPool,nGram);
  // if not enough grammar items to reach n, top back up with extra vocab
  let short=n-nVoc-sampled.length;
  if(short>0){
    const usedEu=new Set(cards.map(c=>c.front));
    const extra=vocPool.filter(({w})=>!usedEu.has(w.eu)&&!usedEu.has(w.es));
    uniformSample(extra,Math.min(short,extra.length)).forEach(({w,u})=>{
      const eu2es=Math.random()<0.5;
      cards.push({type:'vocab',label:pre(u)+(eu2es?'Euskaraz → Gaztelaniaz':'Gaztelaniaz → Euskaraz'),
        front:eu2es?w.eu:w.es, back:eu2es?w.es:w.eu, w:multi?null:w, flipped:false, picked:null});
    });
  }
  cards.push(...sampled);
  // shuffle all
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  return cards;
}
function startExam(){

  EXAM={cards,i:0,right:0,start:Date.now(),secs:0,global:false};
  if(CLOCK)clearInterval(CLOCK);
  CLOCK=setInterval(()=>{
    if(!EXAM)return clearInterval(CLOCK);
    EXAM.secs=Math.floor((Date.now()-EXAM.start)/1000);

    if(el)el.textContent=fmtTime(EXAM.secs);
  },1000);

}
function fmtTime(s){const m=Math.floor(s/60);return(m?m+'m ':'')+((s%60)+'s');}
function examFlip(){

function examSelf(correct){
  if(!EXAM)return;

  if(correct)EXAM.right++;
  if(c.w)rec(c.w.eu,correct,false);
  const last=EXAM.i===EXAM.cards.length-1;

function finishExam(){
  if(CLOCK){clearInterval(CLOCK);CLOCK=null;}
  const score=EXAM.right,total=EXAM.cards.length,secs=EXAM.secs;
  const entry={date:Date.now(),score,total,secs,pct:Math.round(score/total*100)};
  if(EXAM.global){GEXAMS.push(entry);save('b21_global_exams',GEXAMS);}
  else{EXAMS.push(entry);save(uk('exams'),EXAMS);}
  EXAM=null;render();
}
function pctColor(pct){
  /* gradient: 0%=deep indigo, 50%=marine blue, 100%=turquoise — higher score = brighter/higher in the gradient */
  const stops=[[91,42,134],[37,99,172],[0,229,196]];
  const t=Math.max(0,Math.min(100,pct))/100;
  const seg=t<.5?0:1,lt=t<.5?t/.5:(t-.5)/.5;
  const a=stops[seg],b=stops[seg+1];
  const r=Math.round(a[0]+(b[0]-a[0])*lt),g=Math.round(a[1]+(b[1]-a[1])*lt),bl=Math.round(a[2]+(b[2]-a[2])*lt);
  return`rgb(${r},${g},${bl})`;
}
function azterChart(hist){
  hist=hist||EXAMS;
  if(!hist.length)return'';
  const data=hist.slice(-15);
  const W=400,H=140,padL=14,padR=14,padT=18,padB=26;
  const iw=W-padL-padR,ih=H-padT-padB;
  const px=i=>data.length===1?padL+iw/2:padL+i/(data.length-1)*iw;
  const py=e=>padT+ih-(e.score/e.total)*ih;
  const halfY=padT+ih-.5*ih;
  const halfLine=`<line x1="${padL}" y1="${halfY}" x2="${W-padR}" y2="${halfY}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".5"/>`;
  const edgeLines=`<line x1="${padL}" y1="${padT}" x2="${W-padR}" y2="${padT}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="var(--border)" stroke-width="1"/>`;
  const grad=`<defs><linearGradient id="azterLine" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="rgb(91,42,134)"/><stop offset="50%" stop-color="rgb(37,99,172)"/><stop offset="100%" stop-color="rgb(0,229,196)"/>
  </linearGradient></defs>`;
  const path=data.length>1?`<polyline points="${data.map((e,i)=>px(i)+','+py(e)).join(' ')}" fill="none" stroke="url(#azterLine)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`:'';
  const pts=data.map((e,i)=>{
    const x=px(i),y=py(e);
    const col=pctColor(e.pct);
    const dt=new Date(e.date).toLocaleDateString('eu-ES',{month:'short',day:'numeric'});
    return`<circle cx="${x}" cy="${y}" r="4.5" fill="${col}" stroke="var(--card)" stroke-width="1.5"/>
      <text x="${x}" y="${H-8}" fill="var(--muted)" font-size="9" text-anchor="middle">${dt}</text>`;
  }).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block;margin:12px 0">${grad}${edgeLines}${halfLine}${path}${pts}</svg>`;
}

function setLen(n){LEN=n;save(uk('len'),n);render();}
function setDir(v){DIR=v;save(uk('dir'),v);render();}
function dirChips(){return[['eu','EU → ES'],['es','ES → EU'],['mix','🔀 Nahastuta']].map(([k,l])=>`<button class="chip ${DIR===k?'on':''}" onclick="setDir('${k}')">${l}</button>`).join('');}
function cardDir(){return DIR==='mix'?(Math.random()<.5?'eu':'es'):DIR;}

function pickWords(scope){
  let ws=[...UNIT.vocabulary];
  if(scope==='hard')ws=ws.filter(w=>wp(w.eu).d);
  else if(scope==='due')ws=ws.filter(w=>isDue(wp(w.eu)));
  else if(scope!=='all')ws=ws.filter(w=>w.section===scope);
  ws=weightedOrder(ws);
  if(LEN>0&&ws.length>LEN)ws=ws.slice(0,LEN);
  return ws;
}

/* ── FLASHCARDS ── */
function startFlash(scope){

}

function flip(){const fc=document.getElementById('fc');if(!fc)return;S.ex.flip=!S.ex.flip;fc.classList.toggle('flip',S.ex.flip);if(S.ex.flip)document.getElementById('fcc').style.display='flex';}
function fcAns(r){
  const e=S.ex,w=e.ws[e.i];
